# NitroSense for Linux - 10-band EQ used for sound modes.
# Installed to ~/.config/pipewire/pipewire.conf.d/ by install.sh.
# It is a WirePlumber "smart filter": audio sent to the default output passes
# through it automatically, whether that is speakers, headphones or HDMI.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Nitro Sense Audio"
            media.name       = "Nitro Sense Audio"
            filter.graph = {
                nodes = [
                    { type = builtin name = preamp label = bq_highshelf control = { "Freq" = 0.0     "Q" = 1.0  "Gain" = 0.0 } }
                    { type = builtin name = eq_31  label = bq_lowshelf  control = { "Freq" = 31.0    "Q" = 0.7  "Gain" = 0.0 } }
                    { type = builtin name = eq_62  label = bq_peaking   control = { "Freq" = 62.0    "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_125 label = bq_peaking   control = { "Freq" = 125.0   "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_250 label = bq_peaking   control = { "Freq" = 250.0   "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_500 label = bq_peaking   control = { "Freq" = 500.0   "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_1k  label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_2k  label = bq_peaking   control = { "Freq" = 2000.0  "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_4k  label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_8k  label = bq_peaking   control = { "Freq" = 8000.0  "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = eq_16k label = bq_highshelf control = { "Freq" = 16000.0 "Q" = 0.7  "Gain" = 0.0 } }
                ]
                links = [
                    { output = "preamp:Out" input = "eq_31:In" }
                    { output = "eq_31:Out"  input = "eq_62:In" }
                    { output = "eq_62:Out"  input = "eq_125:In" }
                    { output = "eq_125:Out" input = "eq_250:In" }
                    { output = "eq_250:Out" input = "eq_500:In" }
                    { output = "eq_500:Out" input = "eq_1k:In" }
                    { output = "eq_1k:Out"  input = "eq_2k:In" }
                    { output = "eq_2k:Out"  input = "eq_4k:In" }
                    { output = "eq_4k:Out"  input = "eq_8k:In" }
                    { output = "eq_8k:Out"  input = "eq_16k:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name         = "nitrosense_eq"
                media.class       = Audio/Sink
                filter.smart      = true
                filter.smart.name = "nitrosense_eq"
            }
            playback.props = {
                node.name         = "nitrosense_eq.output"
                node.passive      = true
                filter.smart      = true
                filter.smart.name = "nitrosense_eq"
            }
        }
    }
]
